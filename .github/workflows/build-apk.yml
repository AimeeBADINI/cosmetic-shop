name: Build Cosmetic Shop APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython==0.29.36

      - name: Construire APK
        env:
          ACCEPT_ANDROID_SDK_LICENSE: "y"
        run: |
          buildozer android debug

      - name: Chercher les fichiers APK
        run: |
          echo "===================================="
          echo "Recherche des fichiers APK / AAB"
          echo "===================================="

          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print

          echo "===================================="
          echo "Contenu du dossier bin"
          echo "===================================="

          if [ -d "bin" ]; then
            ls -lah bin
          else
            echo "Le dossier bin n'existe pas."
          fi

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: cosmetic-shop-apk
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: error
