name: Build Cosmetic Shop APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython==0.29.36

      - name: Installer les dependances systeme
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Preparer le SDK Android
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/tools/bin"
          mkdir -p "$SDK/licenses"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O android-tools.zip

          rm -rf android-cmdline-tools
          mkdir android-cmdline-tools

          unzip -q android-tools.zip -d android-cmdline-tools

          cp -r android-cmdline-tools/cmdline-tools/* "$SDK/tools/"

          echo "========================================"
          echo "Verification sdkmanager"
          echo "========================================"

          ls -lah "$SDK/tools/bin"

          "$SDK/tools/bin/sdkmanager" --version

      - name: Accepter les licences Android
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          yes | "$SDK/tools/bin/sdkmanager" --licenses || true

          echo "========================================"
          echo "Licences Android"
          echo "========================================"

          ls -lah "$SDK/licenses"

      - name: Installer les composants Android
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          "$SDK/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Construire APK
        run: |
          buildozer android debug

      - name: Rechercher les APK
        run: |
          echo "========================================"
          echo "RECHERCHE DES APK"
          echo "========================================"

          find . -type f -name "*.apk" -print

          echo "========================================"
          echo "CONTENU DU DOSSIER BIN"
          echo "========================================"

          if [ -d "bin" ]; then
            ls -lah bin
          else
            echo "Le dossier bin n'existe pas."
          fi

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: cosmetic-shop-apk
          path: |
            **/*.apk
          if-no-files-found: error
